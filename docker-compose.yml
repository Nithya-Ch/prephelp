services:
  client:
    build: ./client
    ports:
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
    depends_on:
      - server

  server:
    build: ./server
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/prephelp
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8000
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules
      - uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./worker
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://mongo:27017/prephelp
      REDIS_URL: redis://redis:6379
      ML_SERVICE_URL: http://ml-service:8000
    volumes:
      - ./worker:/app
      - worker_node_modules:/app/node_modules
      - uploads_data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started

  ml-service:
    build: ./ml-service
    ports:
      - "8000:8000"
    environment:
      WHISPER_MODEL: "base"
    volumes:
      - ./ml-service:/app
      - uploads_data:/app/uploads

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  client_node_modules:
  server_node_modules:
  worker_node_modules:
  mongo_data:
  uploads_data:
